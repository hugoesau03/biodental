server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir respuestas de texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cachea agresivamente los assets versionados por CRA (contienen hash en el nombre)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy de la API hacia el backend (mismo origen desde el navegador: evita CORS)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Debe cubrir el límite del backend (express.json limit: '50mb', usado para
        # documentos/avatares en base64), si no nginx rechaza el request con 413 antes de reenviarlo.
        client_max_body_size 55m;
    }

    # SPA: cualquier ruta no encontrada cae a index.html (react-router-dom)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
