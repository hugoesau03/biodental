server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprimir respuestas de texto
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cachea agresivamente los assets versionados por CRA (contienen hash en el nombre)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # OJO: `add_header` en nginx NO se hereda del bloque `server` cuando el
        # `location` define su propio `add_header` (como el Cache-Control de
        # arriba) — hay que repetirlos aquí explícitamente o esta ubicación se
        # queda sin ninguna cabecera de seguridad. Mismo bloque que en `location /`.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), camera=(self)" always;

        try_files $uri =404;
    }

    # Proxy de la API hacia el backend (mismo origen desde el navegador: evita CORS).
    # No se repiten las cabeceras de seguridad aquí a propósito: el backend
    # (backend/app.js) ya las pone en sus propias respuestas JSON, y
    # proxy_pass las deja pasar tal cual — duplicarlas aquí sería redundante.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Debe cubrir el límite del backend (express.json limit: '50mb', usado para
        # documentos/avatares en base64), si no nginx rechaza el request con 413 antes de reenviarlo.
        client_max_body_size 55m;
    }

    # SPA: cualquier ruta no encontrada cae a index.html (react-router-dom)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";

        # Cabeceras de seguridad para la página HTML real que ve el navegador
        # — antes de esto, solo las respuestas JSON del backend llevaban
        # algunas (y CSP en una API JSON no hace prácticamente nada, porque
        # nada la renderiza como HTML). Ver la nota de arriba sobre por qué
        # se repiten en cada location.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        # No hace nada si se sirve por HTTP plano (los navegadores solo la
        # respetan sobre HTTPS) — queda lista para cuando haya TLS delante
        # (proxy, Cloudflare, etc.), sin romper nada mientras tanto.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # 'unsafe-inline' en style-src es necesario porque styled-components
        # inyecta <style> en runtime sin nonce — quitarlo rompe todo el
        # theming. fonts.googleapis.com/gstatic.com son Google Fonts (ver
        # index.html); data: en img-src es para avatares/documentos guardados
        # como base64.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        # Camera: se usa de verdad para escanear QR de check-in (EscanearCheckin.js).
        add_header Permissions-Policy "geolocation=(), microphone=(), payment=(), usb=(), camera=(self)" always;
    }
}
